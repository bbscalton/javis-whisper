name: build-apk
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env: { KS_B64: '${{ secrets.KS_B64 }}' }
        run: if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/jw.p12; echo "KS_FILE=$RUNNER_TEMP/jw.p12" >> $GITHUB_ENV; fi
      - name: Build
        env: { KS_PASS: '${{ secrets.KS_PASS }}' }
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk JavisWhisper.apk
      - uses: actions/upload-artifact@v4
        with: { name: JavisWhisper, path: JavisWhisper.apk }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" JavisWhisper.apk --title "Javis Whisper $GITHUB_REF_NAME" --notes "Prototype build. Install, pair with your PC01 server, connect earbuds, START." || gh release upload "$GITHUB_REF_NAME" JavisWhisper.apk --clobber
